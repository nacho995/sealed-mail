name: Demo on GitHub Pages

# Publishes the "play the server" demo. It runs the app's own crypto module, so it
# is rebuilt whenever that module, the stylesheet or the demo itself changes.
on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'public/js/crypto.js'
      - 'public/css/styles.css'
      - 'public/fonts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node demo/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
